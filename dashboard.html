<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Merchant Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        h1 { font-size: 24px; color: #0f172a; margin-top: 0; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; margin-top: 12px; }
        button:hover { background: #0369a1; }
        .result-box { margin-top: 24px; padding: 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; display: none; }
        .result-box a { color: #15803d; font-weight: 600; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Your Storefront</h1>
        <p>Set up your shop and product in under 60 seconds.</p>

        <form id="store-form">
            <div class="form-group">
                <label>Store Name</label>
                <input type="text" id="store_name" placeholder="e.g. Acme Tech Tools" required>
            </div>
            <div class="form-group">
                <label>Store URL Slug</label>
                <input type="text" id="slug" placeholder="e.g. acme-tools" required>
            </div>
            <div class="form-group">
                <label>Merchant Email</label>
                <input type="email" id="email" placeholder="owner@acme.com" required>
            </div>
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;">
            <div class="form-group">
                <label>First Product Name</label>
                <input type="text" id="prod_title" placeholder="e.g. Python Automation Playbook" required>
            </div>
            <div class="form-group">
                <label>Price (INR)</label>
                <input type="number" id="prod_price" placeholder="e.g. 500" required>
            </div>
            <button type="submit">Launch Store & Product</button>
        </form>

        <div id="result" class="result-box">
            ✅ Store is live! Share your customer checkout link:<br>
            <a id="store-link" href="#" target="_blank"></a>
        </div>
    </div>

    <script>
        document.getElementById('store-form').onsubmit = async function(e) {
            e.preventDefault();
            const payload = {
                store_name: document.getElementById('store_name').value,
                slug: document.getElementById('slug').value,
                email: document.getElementById('email').value,
                product_title: document.getElementById('prod_title').value,
                price: parseInt(document.getElementById('prod_price').value)
            };

            const res = await fetch('/api/create-store', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            if (data.store_url) {
                const box = document.getElementById('result');
                const link = document.getElementById('store-link');
                link.href = data.store_url;
                link.innerText = window.location.origin + data.store_url;
                box.style.display = 'block';
            }
        };
    </script>
</body>
</html>
