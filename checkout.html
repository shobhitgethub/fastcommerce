<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Storefront Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f6f8; margin: 0; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 360px; text-align: center; }
        .badge { background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        h2 { margin: 16px 0 8px; font-size: 22px; color: #1e293b; }
        p { color: #64748b; font-size: 14px; margin: 0 0 24px; }
        .price { font-size: 32px; font-weight: 700; color: #0f172a; margin-bottom: 24px; }
        button { background: #2563eb; color: white; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .split-info { margin-top: 20px; font-size: 12px; color: #94a3b8; text-align: left; background: #f8fafc; padding: 12px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Merchant Storefront</span>
        <h2>Pro Automation Starter Kit</h2>
        <p>Instant digital download & source code</p>
        <div class="price">₹1,000</div>
        <button id="pay-btn">Buy Now</button>

        <div class="split-info">
            <strong>Platform Economics:</strong><br>
            • Merchant Share: ₹950 (95%)<br>
            • Platform Fee: ₹50 (5%)
        </div>
    </div>

    <script>
        document.getElementById('pay-btn').onclick = async function () {
            // Fetch dynamically generated order from your backend
            const response = await fetch('/create-order', { method: 'POST' });
            const data = await response.json();

            const options = {
                "key": data.key_id,
                "amount": data.amount,
                "currency": "INR",
                "name": "Demo Merchant Store",
                "description": "Pro Automation Starter Kit",
                "order_id": data.order_id,
                "handler": function (response) {
                    alert("✅ Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
                },
                "prefill": {
                    "name": "Test Customer",
                    "email": "customer@example.com",
                    "contact": "9999999999"
                },
                "theme": { "color": "#2563eb" }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        };
    </script>
</body>
</html>
